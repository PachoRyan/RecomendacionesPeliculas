services:
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: coconut
      MYSQL_DATABASE: movie_finder
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pcoconut"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  servidor-node:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: servidor-node-container
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./server/.env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  cliente:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cliente-container
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - servidor-node

volumes:
  mysql_data:
